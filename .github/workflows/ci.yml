name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          # --no-deps: the locks are complete closures, so pip resolves nothing.
          pip install --no-deps -r requirements.lock.txt -r requirements-dev.lock.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -q

  gate:
    name: Acceptance gate (fresh clone to approved invoice)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Exactly the documented path: configure env, then one command.
      - name: Configure environment
        run: cp .env.example .env

      - name: Start the stack
        run: INSTALL_DEV=1 docker compose up -d --build --wait

      - name: Migrations are idempotent
        run: |
          docker compose run --rm migrate python scripts/migrate.py --status
          docker compose run --rm migrate python scripts/migrate.py | tee /tmp/migrate.out
          grep -q "schema up to date" /tmp/migrate.out

      - name: Seed the demo organizations
        run: docker compose run --rm api python scripts/seed_demo.py

      # REQUIRE_INTEGRATION turns "no database, skipping" into a failure. A
      # silently skipped tenant-isolation suite is worse than none at all.
      - name: Tenancy and pipeline integration tests
        run: INSTALL_DEV=1 docker compose run --rm -e REQUIRE_INTEGRATION=1 api python -m pytest -q

      - name: Acceptance gate, including cross-tenant attacks
        run: docker compose run --rm -e API_BASE=http://api:8000 api python scripts/acceptance.py

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
