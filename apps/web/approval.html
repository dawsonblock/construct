<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Construction AI Approval</title>
<style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 18px;color:#171717}article{border:1px solid #ddd;border-radius:14px;padding:22px;margin-bottom:16px}button{padding:12px 18px;margin:8px 8px 0 0}.ok{font-weight:700}.bad{font-weight:700}.meta{color:#555}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.pill{padding:8px 10px;border:1px solid #ddd;border-radius:9px}pre{white-space:pre-wrap;overflow:auto;background:#f7f7f7;padding:12px;border-radius:8px}</style></head><body><h1>Financial approval</h1><article><h2 id="subject">Purchase invoice</h2><p class="meta" id="meta">Load an approval through the API.</p><div id="checks"></div><button onclick="act('approve')">Approve</button><button onclick="act('hold')">Hold</button><button onclick="act('reject')">Reject</button></article><article><h2>Evidence packet</h2><div id="packet">No packet loaded.</div></article>
<script>const q=new URLSearchParams(location.search),id=q.get('id');
// The server derives the organization from this key. The page never sends an
// organization id, because a caller-supplied one would not be trusted anyway.
function key(){let k=sessionStorage.getItem('cai_key');if(!k){k=prompt('Organization API key');if(k)sessionStorage.setItem('cai_key',k)}return k||''}
function headers(extra){return Object.assign({'authorization':'Bearer '+key()},extra||{})}
async function load(){if(!id)return;let r=await fetch('/approvals/'+id,{headers:headers()});if(r.status===401){sessionStorage.removeItem('cai_key');document.querySelector('#meta').textContent='Authentication failed — reload to re-enter the API key.';return}if(!r.ok){document.querySelector('#meta').textContent='Approval not found.';return}let a=await r.json();document.querySelector('#subject').textContent=a.reference||a.subject_id;document.querySelector('#meta').textContent=`$${a.amount??''} • ${a.status}`+(a.decided_by?` • by ${a.decided_by}`:'');document.querySelector('#checks').innerHTML=(a.exceptions||[]).length?'<p class="bad">Exceptions: '+a.exceptions.join(', ')+'</p>':'<p class="ok">No verification exceptions.</p>';let p=await fetch(`/approvals/${id}/packet`,{headers:headers()});if(p.ok){let x=await p.json(),checks=x.verification?.checks||{},ev=x.evidence||[];document.querySelector('#packet').innerHTML=`<div class="grid">${Object.entries(checks).map(([k,v])=>`<div class="pill">${v?'✓':'✗'} ${k}</div>`).join('')}</div><h3>Evidence (${ev.length})</h3><pre>${ev.map(e=>`${e.field}: ${JSON.stringify(e.value)}\n  ${e.source_type}/${e.source_id} • confidence ${e.confidence} • authority ${e.authority}`).join('\n\n')}</pre>`}}
async function session(){let s=sessionStorage.getItem('cai_session');if(s)return s;let subject=prompt('Approver identity (dev subject)');if(!subject)return null;let r=await fetch('/auth/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential:subject})});if(!r.ok){alert((await r.json()).detail||'login failed');return null}let t=(await r.json()).session_token;if(t)sessionStorage.setItem('cai_session',t);return t||null}
async function act(x){let t=await session();if(!t)return;let r=await fetch(`/approvals/${id}/${x}`,{method:'POST',headers:{'authorization':'Bearer '+t,'content-type':'application/json'},body:JSON.stringify({reason:''})});if(r.status===401){sessionStorage.removeItem('cai_session');alert('Session expired — reload to log in again.');return}if(!r.ok){alert((await r.json()).detail||'decision rejected')}load()} load();</script></body></html>
